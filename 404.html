<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>404 - Page Not Found | EcoWise</title>
    <link rel="icon" href="#" type="image/png">
    <meta name="description" content="Page not found. The page you are looking for doesn't exist or has been moved.">

    <!-- Tailwind + Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'ewaste-primary': '#0F4C3A',
                        'ewaste-secondary': '#E67E22',
                        'ewaste-accent': '#F1C40F',
                        'ewaste-dark': '#1a1a1a',
                        'ewaste-light': '#F4F7F6',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .floating-particle {
            position: fixed;
            font-size: 2.4rem;
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatY {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-24px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: floatY 6s ease-in-out infinite;
        }

        @keyframes floatSpin {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .float-spin {
            animation: floatSpin 8s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.6; transform: scale(1); }
        }
        .pulse-glow {
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }
        .btn-shine:hover::after {
            left: 100%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .dark .glass-card {
            background: rgba(30, 30, 30, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
        }

        /* Dark mode icon fix */
        .dark .fa-sun {
            display: inline-block !important;
        }
        .dark .fa-moon {
            display: none !important;
        }
        .fa-moon {
            display: inline-block;
        }
        .fa-sun {
            display: none;
        }

        [dir="rtl"] .rtl\:rotate-180 {
            transform: rotate(180deg);
        }
        [dir="rtl"] .rtl\:right-auto {
            right: auto;
        }
        [dir="rtl"] .rtl\:left-0 {
            left: 0;
        }

        .error-code {
            font-size: 8rem;
            line-height: 1;
            font-weight: 900;
            background: linear-gradient(135deg, #E67E22, #0F4C3A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @media (min-width: 768px) {
            .error-code {
                font-size: 12rem;
            }
        }
        @media (min-width: 1024px) {
            .error-code {
                font-size: 16rem;
            }
        }

        .dark .error-code {
            background: linear-gradient(135deg, #E67E22, #F1C40F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>

<body class="bg-ewaste-light dark:bg-ewaste-dark text-gray-800 dark:text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center">

    <!-- Floating particles -->
    <div class="floating-particle left-[5%] top-[15%] animate-float">♻️</div>
    <div class="floating-particle right-[8%] top-[25%] animate-float" style="animation-delay: 2s;">🔧</div>
    <div class="floating-particle left-[10%] bottom-[20%] animate-float" style="animation-delay: 4s;">💻</div>
    <div class="floating-particle right-[12%] bottom-[30%] animate-float" style="animation-delay: 3s;">🌱</div>

    <!-- Top Controls (RTL / Theme) - Minimal -->
    <div class="fixed top-4 right-4 sm:top-6 sm:right-6 flex items-center gap-3 z-50">
        <button id="rtl-toggle"
            class="w-10 h-10 rounded-full bg-white/80 dark:bg-black/60 backdrop-blur-md shadow-sm border border-ewaste-secondary/40 flex items-center justify-center text-ewaste-dark dark:text-white hover:text-ewaste-secondary hover:border-ewaste-secondary transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-ewaste-secondary active:scale-95">
            <i class="fas fa-exchange-alt text-xs"></i>
        </button>
        <button id="theme-toggle"
            class="w-10 h-10 rounded-full bg-white/80 dark:bg-black/60 backdrop-blur-md shadow-sm border border-ewaste-secondary/40 flex items-center justify-center text-ewaste-dark dark:text-white hover:text-ewaste-secondary hover:border-ewaste-secondary transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-ewaste-secondary active:scale-95">
            <i class="fas fa-moon text-sm"></i>
            <i class="fas fa-sun hidden text-sm"></i>
        </button>
    </div>

    <!-- 404 Content -->
    <div class="relative z-10 w-full max-w-4xl mx-auto px-5 sm:px-6 lg:px-8 py-12">
        <div class="text-center">
            <!-- 404 Error Code -->
            <div class="error-code pulse-glow">404</div>

            <!-- Icon -->
            <div class="flex justify-center mb-6 float-spin">
                <div class="w-24 h-24 rounded-full bg-ewaste-secondary/10 dark:bg-ewaste-secondary/20 flex items-center justify-center text-5xl text-ewaste-secondary">
                    <i class="fas fa-recycle"></i>
                </div>
            </div>

            <!-- Message -->
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-serif font-bold text-gray-900 dark:text-white mb-4">
                Oops! Page Not Found
            </h1>
            <p class="text-gray-600 dark:text-gray-300 text-base sm:text-lg max-w-2xl mx-auto leading-relaxed">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>

            <!-- Search / Suggestions -->
          
            <!-- Action Buttons -->
            <div class="mt-8 flex flex-wrap justify-center gap-4">
                <a href="index.html" class="btn-shine bg-ewaste-secondary hover:bg-ewaste-primary text-white px-8 py-3.5 rounded-full text-sm font-bold transition shadow-lg hover:shadow-xl flex items-center gap-2">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="contact.html" class="glass-card text-gray-700 dark:text-white hover:bg-white/50 dark:hover:bg-white/5 px-8 py-3.5 rounded-full text-sm font-bold transition flex items-center gap-2">
                    <i class="fas fa-headset text-ewaste-secondary"></i> Contact Support
                </a>
            </div>

            <!-- Footer Note -->
            <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-8">
                <i class="fas fa-recycle mr-1 text-ewaste-secondary"></i> EcoWise — E-Waste Recycling for a Sustainable Future
            </p>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script>
        (function() {
            // Theme Toggle
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;

            function updateThemeIcons() {
                const isDark = html.classList.contains('dark');
                const sunIcon = themeToggle?.querySelector('.fa-sun');
                const moonIcon = themeToggle?.querySelector('.fa-moon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.classList.remove('hidden');
                        moonIcon.classList.add('hidden');
                    } else {
                        sunIcon.classList.add('hidden');
                        moonIcon.classList.remove('hidden');
                    }
                }
            }

            function toggleTheme() {
                html.classList.toggle('dark');
                localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
                updateThemeIcons();
            }

            if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

            // Initialize theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('prefers-color-scheme: dark').matches)) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            updateThemeIcons();

            // RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');

            function toggleRTL() {
                if (html.getAttribute('dir') === 'rtl') html.removeAttribute('dir');
                else html.setAttribute('dir', 'rtl');
                localStorage.setItem('direction', html.getAttribute('dir') || 'ltr');
            }

            if (rtlBtn) rtlBtn.addEventListener('click', toggleRTL);
            if (localStorage.getItem('direction') === 'rtl') html.setAttribute('dir', 'rtl');

        })();
    </script>
</body>

</html>
