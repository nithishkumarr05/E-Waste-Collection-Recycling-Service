
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>EcoWise | Sign Up — E-Waste Recycling</title>
    <link rel="icon" href="#" type="image/png">
    <meta name="description" content="Create your EcoWise account to start recycling e‑waste, schedule pickups, and track your environmental impact.">
    
    <!-- Tailwind + Fonts + Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'ewaste-primary': '#0F4C3A',
                        'ewaste-secondary': '#E67E22',
                        'ewaste-accent': '#F1C40F',
                        'ewaste-dark': '#1a1a1a',
                        'ewaste-light': '#F4F7F6',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        /* Prevent scrolling - fixed full viewport */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #F4F7F6;
            transition: background-color 0.3s;
        }
        .dark html, .dark body {
            background: #1a1a1a;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }
        .dark .glass-card {
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(2px);
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .slow-zoom {
            animation: slowZoom 28s ease-in-out infinite alternate;
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-shine:hover::after {
            left: 100%;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .toast-animation {
            animation: toastFade 2.5s ease forwards;
        }

        [dir="rtl"] .rtl\:right-auto {
            right: auto;
        }
        [dir="rtl"] .rtl\:left-0 {
            left: 0;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #f9f9f9 inset !important;
        }
        .dark input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #0a0a0a inset !important;
            -webkit-text-fill-color: #e5e5e5 !important;
        }

        .dark .fa-sun {
            display: none !important;
        }
        .dark .fa-moon {
            display: inline-block !important;
        }
        .fa-moon {
            display: none;
        }
        .fa-sun {
            display: inline-block;
        }

        /* Fixed center container */
        .signup-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 30% 40%, rgba(230,126,34,0.08) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(15,76,58,0.06) 0%, transparent 55%);
        }
        .dark .signup-container {
            background: radial-gradient(circle at 30% 40%, rgba(230,126,34,0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(15,76,58,0.08) 0%, transparent 55%);
        }

        /* Main card - fixed height with proper spacing */
        .main-card {
            width: 100%;
            max-width: 950px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 1.5rem;
        }
        @media (min-width: 768px) {
            .main-card {
                flex-direction: row;
                max-height: 560px;
                border-radius: 2rem;
            }
        }

        /* Left panel - scrollable if needed */
        .left-panel {
            overflow-y: auto;
            padding: 1.25rem;
            flex: 1;
        }
        .left-panel::-webkit-scrollbar {
            width: 3px;
        }
        .left-panel::-webkit-scrollbar-thumb {
            background: #E67E22;
            border-radius: 10px;
        }
        .left-panel {
            scrollbar-width: thin;
            scrollbar-color: #E67E22 transparent;
        }
        @media (min-width: 768px) {
            .left-panel {
                padding: 1.5rem 2rem;
                width: 50%;
                max-height: 560px;
            }
        }

        /* Right panel - hidden on mobile */
        .right-panel {
            display: none;
        }
        @media (min-width: 768px) {
            .right-panel {
                display: flex;
                width: 50%;
                position: relative;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                border-left: 1px solid rgba(229, 231, 235, 0.5);
            }
            .dark .right-panel {
                border-color: rgba(255, 255, 255, 0.05);
            }
        }

        .social-login-btn {
            transition: all 0.3s ease;
        }
        .social-login-btn:active {
            transform: scale(0.95);
        }

        .form-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.3s;
            color: #1a1a1a;
        }
        .dark .form-input {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
            color: white;
        }
        .form-input:focus {
            outline: none;
            border-color: #E67E22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.2);
        }
        .dark .form-input:focus {
            border-color: #E67E22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }

        .form-label {
            display: block;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #374151;
            margin-bottom: 0.25rem;
        }
        .dark .form-label {
            color: #9ca3af;
        }

        [dir="rtl"] .form-input {
            text-align: right;
        }
        [dir="rtl"] .form-label {
            text-align: right;
        }
        [dir="rtl"] .text-center {
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Top Controls (RTL / Theme) - fixed position -->
    <div class="fixed top-4 right-4 sm:top-6 sm:right-6 flex items-center gap-3 z-50">
        <button id="rtl-toggle-signup"
            class="w-10 h-10 rounded-full bg-white/80 dark:bg-black/60 backdrop-blur-md shadow-sm border border-ewaste-secondary/40 flex items-center justify-center text-ewaste-dark dark:text-white hover:text-ewaste-secondary hover:border-ewaste-secondary transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-ewaste-secondary active:scale-95">
            <i class="fas fa-exchange-alt text-xs"></i>
        </button>
        <button id="theme-toggle-signup"
            class="w-10 h-10 rounded-full bg-white/80 dark:bg-black/60 backdrop-blur-md shadow-sm border border-ewaste-secondary/40 flex items-center justify-center text-ewaste-dark dark:text-white hover:text-ewaste-secondary hover:border-ewaste-secondary transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-ewaste-secondary active:scale-95">
            <i class="fas fa-sun text-sm"></i>
            <i class="fas fa-moon hidden text-sm"></i>
        </button>
    </div>

    <!-- Signup Container - fixed center -->
    <div class="signup-container">

        <!-- Main Card -->
        <div class="main-card glass-card shadow-2xl border border-gray-200 dark:border-white/10">

            <!-- Left Panel -->
            <div class="left-panel bg-white/95 dark:bg-ewaste-dark/95">

                <!-- Brand Logo & Welcome Header -->
                <div class="text-center mb-3">
                    <a href="index.html" class="inline-flex items-center gap-2 mb-1 select-none group">
                        <i class="fas fa-recycle text-2xl text-ewaste-secondary group-hover:text-ewaste-primary transition-colors"></i>
                        <span class="text-2xl font-bold tracking-tight text-gray-800 dark:text-white">Eco<span class="text-ewaste-secondary">Wise</span></span>
                    </a>
                    <h2 class="text-xl sm:text-2xl font-serif font-bold text-ewaste-dark dark:text-white">Create Account</h2>
                    <p class="text-xs text-gray-500 dark:text-gray-400 font-light">Join EcoWise and start recycling responsibly</p>
                </div>

                <!-- Social signup row -->
                <div class="flex justify-center gap-3 mb-3">
                    <button class="social-login-btn flex-1 h-9 bg-gray-50 dark:bg-white/5 rounded-xl border border-gray-200 dark:border-white/10 flex items-center justify-center hover:bg-ewaste-secondary/10 dark:hover:bg-ewaste-secondary/20 focus:ring-2 focus:ring-ewaste-secondary focus:outline-none">
                        <i class="fab fa-google text-[#DB4437] text-sm"></i>
                    </button>
                    <button class="social-login-btn flex-1 h-9 bg-gray-50 dark:bg-white/5 rounded-xl border border-gray-200 dark:border-white/10 flex items-center justify-center hover:bg-ewaste-secondary/10 dark:hover:bg-ewaste-secondary/20 focus:ring-2 focus:ring-ewaste-secondary focus:outline-none">
                        <i class="fab fa-facebook-f text-[#1877F2] text-sm"></i>
                    </button>
                    <button class="social-login-btn flex-1 h-9 bg-gray-50 dark:bg-white/5 rounded-xl border border-gray-200 dark:border-white/10 flex items-center justify-center hover:bg-ewaste-secondary/10 dark:hover:bg-ewaste-secondary/20 focus:ring-2 focus:ring-ewaste-secondary focus:outline-none">
                        <i class="fab fa-apple text-gray-900 dark:text-white text-base"></i>
                    </button>
                </div>

                <div class="relative flex items-center justify-center my-2">
                    <div class="w-full border-t border-gray-200 dark:border-white/10"></div>
                    <div class="absolute bg-white dark:bg-ewaste-dark px-3 text-[9px] font-bold text-gray-400 tracking-widest uppercase">
                        Or sign up with email
                    </div>
                </div>

                <form class="space-y-2" id="signupForm">
                    <div>
                        <label class="form-label"><i class="fas fa-user me-1.5 text-ewaste-secondary"></i> Full Name</label>
                        <input type="text" id="signupName" placeholder="John Doe" class="form-input" required>
                    </div>

                    <div>
                        <label class="form-label"><i class="fas fa-envelope me-1.5 text-ewaste-secondary"></i> Email Address</label>
                        <input type="email" id="signupEmail" placeholder="hello@ecowise.com" class="form-input" required>
                    </div>

                    <div>
                        <label class="form-label"><i class="fas fa-phone me-1.5 text-ewaste-secondary"></i> Phone Number</label>
                        <input type="tel" id="signupPhone" placeholder="(888) 555-0123" class="form-input">
                    </div>

                    <div>
                        <label class="form-label"><i class="fas fa-lock me-1.5 text-ewaste-secondary"></i> Password</label>
                        <div class="relative">
                            <input type="password" id="signupPassword" placeholder="••••••••" class="form-input pe-10" required>
                            <button type="button" id="togglePasswordBtn"
                                class="absolute inset-y-0 right-0 pe-3 flex items-center text-gray-400 hover:text-ewaste-secondary transition-colors focus:outline-none">
                                <i class="fas fa-eye-slash text-xs" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 text-xs text-gray-600 dark:text-gray-300 pt-0.5">
                        <input type="checkbox" id="termsCheckbox"
                            class="w-3.5 h-3.5 rounded border-gray-300 text-ewaste-secondary focus:ring-ewaste-secondary cursor-pointer bg-transparent" required>
                        <label for="termsCheckbox" class="cursor-pointer">
                            I agree to the <a href="#" class="text-ewaste-secondary hover:underline">Terms</a> &amp; <a href="#" class="text-ewaste-secondary hover:underline">Privacy</a>
                        </label>
                    </div>

                    <button type="submit"
                        class="btn-shine w-full mt-1 h-10 bg-ewaste-secondary hover:bg-ewaste-primary text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-ewaste-secondary active:scale-[0.98]">
                        <i class="fas fa-user-plus text-xs"></i> Create Account
                    </button>
                </form>

                <!-- Bottom text - FIXED with proper padding and margin -->
                <div class="mt-3 pt-0.5 text-center">
                    <p class="text-[12px] font-medium text-gray-500 dark:text-gray-400">
                        Already have an account?
                        <a href="login.html" class="font-bold text-ewaste-secondary hover:text-ewaste-primary transition-colors ml-1">Log In →</a>
                    </p>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <img src="assests/a.jpg" alt="E-Waste Recycling"
                    class="absolute inset-0 w-full h-full object-cover slow-zoom">
                <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/80"></div>
                <div class="absolute right-0 top-0 bottom-0 w-1 bg-ewaste-secondary/80 rtl:right-auto rtl:left-0"></div>

                
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-auto max-w-[90vw]"></div>

    <script>
        (function() {
            // Toast function
            function showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                let bgColor = 'bg-emerald-600';
                let icon = '<i class="fas fa-check-circle text-white text-sm"></i>';
                if (type === 'error') { bgColor = 'bg-red-500';
                    icon = '<i class="fas fa-times-circle text-white text-sm"></i>'; } else if (type === 'warning') { bgColor =
                        'bg-amber-500';
                    icon = '<i class="fas fa-exclamation-triangle text-white text-sm"></i>'; } else if (type === 'info') { bgColor =
                        'bg-ewaste-secondary';
                    icon = '<i class="fas fa-info-circle text-white text-sm"></i>'; }
                toast.className =
                    `toast-animation mb-2 px-5 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 pointer-events-auto ${bgColor} text-white max-w-full`;
                toast.innerHTML = `${icon} <span class="break-words">${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { if (toast && toast.remove) toast.remove(); }, 2600);
            }

            // Password toggle
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passwordInput = document.getElementById('signupPassword');
            const toggleIcon = document.getElementById('toggleIcon');
            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', () => {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        toggleIcon.classList.remove('fa-eye-slash');
                        toggleIcon.classList.add('fa-eye');
                    } else {
                        passwordInput.type = 'password';
                        toggleIcon.classList.remove('fa-eye');
                        toggleIcon.classList.add('fa-eye-slash');
                    }
                });
            }

            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle-signup');
            const htmlTag = document.documentElement;

            function updateThemeIcons() {
                const isDark = htmlTag.classList.contains('dark');
                const sunIcon = document.querySelector('#theme-toggle-signup .fa-sun');
                const moonIcon = document.querySelector('#theme-toggle-signup .fa-moon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.classList.add('hidden');
                        moonIcon.classList.remove('hidden');
                    } else {
                        sunIcon.classList.remove('hidden');
                        moonIcon.classList.add('hidden');
                    }
                }
            }

            function toggleTheme() {
                if (htmlTag.classList.contains('dark')) {
                    htmlTag.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    showToast('Light mode activated ☀️', 'info');
                } else {
                    htmlTag.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    showToast('Dark mode activated 🌙', 'info');
                }
                updateThemeIcons();
            }
            if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

            // Initialize theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia(
                    'prefers-color-scheme: dark').matches)) {
                htmlTag.classList.add('dark');
            } else {
                htmlTag.classList.remove('dark');
            }
            updateThemeIcons();

            // RTL Toggle
            const rtlToggle = document.getElementById('rtl-toggle-signup');

            function applyRTLStyles(isRtl) {
                if (isRtl) {
                    htmlTag.setAttribute('dir', 'rtl');
                    localStorage.setItem('direction', 'rtl');
                } else {
                    htmlTag.removeAttribute('dir');
                    localStorage.setItem('direction', 'ltr');
                }
            }

            function toggleRTL() {
                const currentDir = htmlTag.getAttribute('dir');
                if (currentDir === 'rtl') {
                    applyRTLStyles(false);
                    showToast('LTR layout activated', 'info');
                } else {
                    applyRTLStyles(true);
                    showToast('RTL layout for right-to-left languages', 'info');
                }
            }
            if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
            if (localStorage.getItem('direction') === 'rtl') {
                htmlTag.setAttribute('dir', 'rtl');
            } else if (localStorage.getItem('direction') === 'ltr') {
                htmlTag.removeAttribute('dir');
            }

            const signupForm = document.getElementById('signupForm');
            if (signupForm) {
                signupForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('signupName').value.trim();
                    const email = document.getElementById('signupEmail').value.trim();
                    const password = document.getElementById('signupPassword').value;
                    const termsChecked = document.getElementById('termsCheckbox').checked;

                    if (!name) { showToast('Please enter your full name', 'warning'); return; }
                    if (!email) { showToast('Please enter your email address', 'warning'); return; }
                    if (!email.includes('@') || !email.includes('.')) { showToast(
                            'Please enter a valid email address', 'error'); return; }
                    if (!password) { showToast('Please enter a password', 'warning'); return; }
                    if (password.length < 6) { showToast('Password must be at least 6 characters', 'warning'); return; }
                    if (!termsChecked) { showToast('Please agree to the Terms of Service', 'warning'); return; }

                    showToast(`♻️ Welcome to EcoWise, ${name}! Your account has been created.`, 'success');
                });
            }

            // Social signup demo
            document.querySelectorAll('.social-login-btn').forEach(btn => {
                btn.addEventListener('click', () => { showToast(
                        'Social signup demo — integrate your auth provider', 'info'); });
            });
        })();
    </script>
</body>

</html>
